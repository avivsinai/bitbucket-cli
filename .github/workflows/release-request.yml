name: Release request

run-name: Release request ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-request
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Require master and X.Y.Z version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "::error::Dispatch Release request from master (got ${GITHUB_REF})."
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be X.Y.Z (no leading zeros or prerelease), got: ${RELEASE_VERSION}"
            exit 1
          fi

      - name: Require release App
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" ]]; then
            echo "::error::vars.RELEASE_APP_CLIENT_ID is not set"
            exit 1
          fi
          if [[ -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::secrets.RELEASE_APP_PRIVATE_KEY is not set"
            exit 1
          fi

      # Same App as release.yml. The merge must be attributed to the App so
      # the push to master triggers release.yml (GITHUB_TOKEN merges do not).
      - name: Mint release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Prepare release PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: ./scripts/release.sh "$RELEASE_VERSION" --ci
