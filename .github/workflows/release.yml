name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      release_ref: ${{ steps.prepare.outputs.release_ref }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve release metadata
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail

          validate_tag() {
            local tag="$1"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
              echo "::error::Release identifiers must use vX.Y.Z style tags."
              exit 1
            fi
          }

          tag_commit_sha() {
            git rev-parse "refs/tags/${1}^{commit}" 2>/dev/null || git rev-parse "refs/tags/${1}"
          }

          case "$EVENT_NAME" in
            push)
              commit_subject="${COMMIT_MESSAGE%%$'\n'*}"
              tag="${commit_subject#chore(release): }"
              tag="${tag%% \(#*}"
              validate_tag "$tag"

              version="${tag#v}"
              ./scripts/check-release-version.sh "$version"

              release_sha="${GITHUB_SHA}"
              if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
                existing_sha="$(tag_commit_sha "$tag")"
                if [[ "$existing_sha" != "$release_sha" ]]; then
                  echo "::error::Tag ${tag} already exists but points to ${existing_sha}, not ${release_sha}."
                  exit 1
                fi
              fi
              release_ref="${release_sha}"
              ;;
            *)
              echo "::error::Unsupported event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          prerelease=false
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "release_ref=${release_ref}"
            echo "release_sha=${release_sha}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Verify release metadata
        run: ./scripts/check-release-version.sh "${{ needs.prepare.outputs.version }}"
      - name: Check skill sync
        run: make check-skills
      - name: Verify gofmt
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "The following files need gofmt:" >&2
            echo "$files" >&2
            exit 1
          fi
      - name: Go vet
        run: go vet ./...
      - name: Run tests
        run: make test
      - name: Check Homebrew formula test
        run: ./scripts/check-homebrew-formula-test.sh
      - name: Check WinGet release contract
        run: ./scripts/check-winget-release-contract.sh
      - name: Build CLI
        run: VERSION=${{ needs.prepare.outputs.tag }} make build
      - name: Check embedded version
        run: ./bin/bkt --version | grep -Fx "bkt version ${{ needs.prepare.outputs.tag }}"

  release:
    needs: [prepare, verify]
    if: needs.prepare.result == 'success' && needs.verify.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Install Syft
        run: brew install syft

      # The v* tag ruleset lets only the release App create tags. Until the
      # App is configured (vars.RELEASE_APP_CLIENT_ID), the job token is used.
      - name: Mint release App token
        id: release-app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create release tag after verification
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          GH_TOKEN: ${{ steps.release-app.outputs.token || github.token }}
        run: |
          set -euo pipefail

          tag_commit_sha() {
            git rev-parse "refs/tags/${1}^{commit}" 2>/dev/null || git rev-parse "refs/tags/${1}"
          }

          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing_sha="$(tag_commit_sha "$TAG")"
            if [[ "$existing_sha" != "$RELEASE_SHA" ]]; then
              echo "::error::Tag ${TAG} already exists but points to ${existing_sha}, not ${RELEASE_SHA}."
              exit 1
            fi
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$RELEASE_SHA" >/dev/null
          fi

      - name: Extract release notes for this tag
        shell: bash
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/RELEASE_NOTES.md
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          python3 - "$VERSION" "$RELEASE_NOTES_PATH" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          output_path = pathlib.Path(sys.argv[2])
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"(?ms)^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\n.*?(?=^## \[|\Z)"
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit(f"missing changelog section for {version}")
          output_path.write_text(match.group(0).strip() + "\n", encoding="utf-8")
          PY

      - name: Configure WinGet publishing
        id: winget
        shell: bash
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$WINGET_GITHUB_TOKEN" ]]; then
            echo "::warning::WinGet publishing skipped: WINGET_GITHUB_TOKEN repository secret is not configured."
            echo "skip_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_upload=false" >> "$GITHUB_OUTPUT"
          fi

      # A Developer ID signature gives the binary a stable Keychain partition
      # ID (teamid:), so one "Always Allow" survives upgrades. Ad-hoc builds
      # get a new cdhash: partition per release and prompt again
      # (see scripts/codesign-macos.sh).
      - name: Configure macOS signing
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          names=(P12_BASE64 P12_PASSWORD TEAM_ID NOTARY_ISSUER_ID NOTARY_KEY_ID NOTARY_KEY_P8_BASE64)
          present=0
          for name in "${names[@]}"; do
            [[ -n "${!name}" ]] && present=$((present + 1))
          done
          if (( present == 0 )); then
            echo "::warning::macOS binaries are signed ad-hoc: the APPLE_* signing secrets are not configured, so users get a Keychain prompt after each upgrade."
            exit 0
          fi
          if (( present != ${#names[@]} )); then
            echo "::error::Set all APPLE_* signing secrets or none (see docs/RELEASE.md)."
            exit 1
          fi

          keychain="$RUNNER_TEMP/bkt-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          # Publish the path first so the cleanup step removes the keychain
          # even when a later command here fails.
          echo "BKT_MACOS_KEYCHAIN=$keychain" >>"$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode >"$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # The SHA-1 picks one identity even if the .p12 holds a renewed and
          # an older certificate. -v lists only identities with a trusted
          # chain, so the .p12 must include the Developer ID intermediate.
          identity_sha="$(security find-identity -v -p codesigning "$keychain" \
            | awk -v team="($TEAM_ID)" '/Developer ID Application: / && index($0, team) { print $2; exit }')"
          if [[ -z "$identity_sha" ]]; then
            echo "::error::APPLE_DEVELOPER_ID_P12_BASE64 has no trusted 'Developer ID Application' identity for APPLE_TEAM_ID."
            exit 1
          fi

          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode >"$RUNNER_TEMP/notary-key.p8"
          {
            echo "BKT_MACOS_SIGN_IDENTITY=$identity_sha"
            echo "BKT_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
          } >>"$GITHUB_ENV"

      # Tap and Scoop pushes use a short-lived release App token scoped to
      # those two repos; the PAT is only the fallback until the App is
      # configured (vars.RELEASE_APP_CLIENT_ID). Same pattern as yoetz #623.
      - name: Mint release App token for tap and Scoop
        id: tap-app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: homebrew-tap,scoop-bucket

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-app.outputs.token || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          WINGET_SKIP_UPLOAD: ${{ steps.winget.outputs.skip_upload }}
          BKT_MACOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BKT_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          BKT_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

      - name: Remove macOS signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${BKT_MACOS_KEYCHAIN:-}" ]]; then
            security delete-keychain "$BKT_MACOS_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"

      - name: Collect attestation subjects
        id: attestation_subjects
        shell: bash
        run: |
          set -euo pipefail
          subjects="$(find dist -maxdepth 1 -type f | sort)"
          if [[ -z "$subjects" ]]; then
            echo "::error::No release artifacts found to attest."
            exit 1
          fi
          {
            echo "subjects<<EOF"
            printf '%s\n' "$subjects"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.attestation_subjects.outputs.subjects }}

  skill-publish:
    name: Publish skills
    needs: [prepare, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Take the pinned tooling from the workflow's own commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .skild-tooling
          sparse-checkout: .github/skild

      - name: Install skild
        run: |
          npm ci --prefix .skild-tooling/.github/skild --ignore-scripts
          echo "$GITHUB_WORKSPACE/.skild-tooling/.github/skild/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Configure skild auth
        run: |
          mkdir -p ~/.skild
          echo '${{ secrets.SKILD_AUTH_JSON }}' > ~/.skild/registry-auth.json

      - name: Verify release metadata
        run: ./scripts/check-release-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Publish skills
        run: |
          TAG_VERSION="${{ needs.prepare.outputs.version }}"

          FAILED=0

          for dir in skills/*/; do
            [ -f "$dir/SKILL.md" ] || continue
            SKILL=$(basename "$dir")
            VERSION="${TAG_VERSION}"

            echo "Publishing $SKILL version $VERSION"

            ALIAS_ARGS=()
            if [ ${#SKILL} -ge 3 ] && [ ${#SKILL} -le 64 ]; then
              ALIAS_ARGS=(--alias "$SKILL")
            else
              echo "Warning: Skipping alias for $SKILL: length ${#SKILL} outside 3..64"
            fi

            if OUTPUT=$(skild publish \
              --dir "$dir" \
              "${ALIAS_ARGS[@]}" \
              --skill-version "$VERSION" 2>&1); then
              echo "$OUTPUT"
              echo "Published $SKILL version $VERSION"
            elif echo "$OUTPUT" | grep -q "Version already exists"; then
              echo "$OUTPUT"
              echo "Warning: $SKILL version $VERSION already published — skipping"
            elif echo "$OUTPUT" | grep -q "Alias already in use"; then
              echo "$OUTPUT"
              echo "Warning: Alias '$SKILL' taken — retrying without alias..."
              if OUTPUT2=$(skild publish \
                --dir "$dir" \
                --skill-version "$VERSION" 2>&1); then
                echo "$OUTPUT2"
                echo "Published $SKILL version $VERSION (without alias)"
              elif echo "$OUTPUT2" | grep -q "Version already exists"; then
                echo "$OUTPUT2"
                echo "Warning: $SKILL version $VERSION already published on retry — skipping"
              else
                echo "ERROR: Publish failed for $SKILL (even without alias)"
                echo "$OUTPUT2"
                FAILED=1
              fi
            else
              echo "ERROR: Publish failed for $SKILL"
              echo "$OUTPUT"
              FAILED=1
            fi
          done

          exit $FAILED
