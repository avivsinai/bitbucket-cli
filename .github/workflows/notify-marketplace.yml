name: Notify Skills Marketplace

on:
  push:

permissions:
  contents: read

concurrency:
  group: notify-marketplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mint marketplace dispatch token
        id: marketplace-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: skills-marketplace
          permission-contents: write

      - name: Dispatch plugin update
        env:
          GITHUB_TOKEN: ${{ steps.marketplace-token.outputs.token }}
        shell: bash
        run: |
          payload=$(printf '{"event_type":"plugin-update","client_payload":{"repo":"%s"}}' "$GITHUB_REPOSITORY")
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/avivsinai/skills-marketplace/dispatches \
            -d "$payload"
